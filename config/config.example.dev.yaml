# =============================================================================
# GoLDAPAdmin — 开发环境安全配置示例
# -----------------------------------------------------------------------------
# 适用于本地开发 / 内网测试机。宽松但有底线：
#   - CORS 放开 localhost 开发服务器
#   - TLS 可跳过（开发 LDAP 常用自签名证书）
#   - JWT 密钥可以简单一些，但生产必须替换
# =============================================================================

server:
  port: 8080
  mode: debug                          # debug / release / test

database:
  path: ./data/goldapadmin.db

jwt:
  # 开发环境可简单；部署前务必用 openssl rand 生成随机值替换
  secret: dev-secret-not-for-production-xxxxxxxxxxxxx
  ttl: 24                              # 小时

log:
  level: debug

security:
  # 是否强制 LDAP 连接使用 TLS/SSL（默认 false，开发环境常用 389 明文）
  require_ldap_tls: false
  # 自签名证书是否跳过校验由每个 LdapServer 记录的 skip_tls_verify 字段控制

  # 是否允许匿名（无 BindDN）登录；默认 false
  allow_anonymous_bind: false
  # 允许管理服务器配置的登录 DN 白名单；为空 = 对所有用户关闭管理接口
  admin_dns:
    - "uid=admin,ou=system,dc=example,dc=com"
  # 可信反向代理；为空时只使用 TCP 连接对端地址解析客户端 IP
  trusted_proxies: []
  # 单请求体上限（字节），默认 2MiB
  max_body_bytes: 2097152
  # 只读模式：开启后禁止创建/修改/删除/移动/复制条目与 LDIF 导入
  read_only: false

  cors:
    # 前端 Vite / 开发服务器
    origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      # 若前端通过反向代理（如 http://localhost:8080/admin）
      # 则不需要单独加，因为同源请求不触发 CORS
