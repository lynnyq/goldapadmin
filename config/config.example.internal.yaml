# =============================================================================
# GoLDAPAdmin — 内网环境安全配置示例（IP 段访问 + 自签名证书）
# -----------------------------------------------------------------------------
# 适用于不对外暴露、仅公司内网办公区/VPN 可达的场景：
#   - LDAP 服务器使用自建 CA 签发的证书
#   - 通过内网域名或 VIP 访问
#   - 安全策略介于开发与公网生产之间
# =============================================================================

server:
  port: 8080
  mode: release

database:
  path: /data/goldapadmin/goldapadmin.db

jwt:
  # 内网环境密钥至少 24 字节随机；建议同样用 openssl rand 生成
  secret: INTERNAL_SECRET_REPLACE_ME_WITH_OPENSSL_RAND_XXXXXXXXXXXXXXXXXXXXXXXXX
  ttl: 8                                # 内网场景 JWT 有效期可短一些

log:
  level: info

security:
  # 是否强制 LDAP 连接使用 TLS/SSL（默认 false；内网若为 389 明文则保持 false）
  require_ldap_tls: false
  # 自签名证书是否跳过校验由每个 LdapServer 记录的 skip_tls_verify 字段控制

  # 是否允许匿名（无 BindDN）登录；默认 false
  allow_anonymous_bind: false
  # 允许管理服务器配置的登录 DN 白名单；为空 = 对所有用户关闭管理接口
  admin_dns:
    - "uid=admin,ou=system,dc=company,dc=com"
  # 可信反向代理；位于 Nginx 之后时填写其地址（如 127.0.0.1）
  trusted_proxies:
    - "127.0.0.1"
  # 单请求体上限（字节），默认 2MiB
  max_body_bytes: 2097152
  # 只读模式：开启后禁止创建/修改/删除/移动/复制条目与 LDIF 导入
  read_only: false

  cors:
    # 内网办公网域名 / VIP
    origins:
      - "https://ldapadmin.intranet.company.com"
      - "http://10.10.20.100:8080"
