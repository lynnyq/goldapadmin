# =============================================================================
# GoLDAPAdmin — 生产环境安全配置示例（HTTPS 公网部署）
# -----------------------------------------------------------------------------
# 部署 checklist（务必在上线前逐项确认）：
#   [ ] JWT secret 替换为 32 字节以上随机值
#   [ ] CORS origins 仅列公司域名，禁止 "*"
#   [ ] require_ldap_tls 设为 true（强制 LDAP 加密），服务器记录未开启 skip_tls_verify，LDAP 证书为正式 CA 签发
#   [ ] 数据库文件权限 chmod 600
#   [ ] HTTPS 由 Nginx / Caddy / Kubernetes Ingress 终结，开启 HSTS
#   [ ] 日志级别 info 或 warn，debug 关闭
#   [ ] 服务器防火墙仅开放 80/443（或仅 443）
#
# 生成随机 JWT secret：
#   openssl rand -base64 48
# =============================================================================

server:
  port: 8080                            # 监听内网，公网访问由反向代理终结
  mode: release

database:
  # 与 RPM 部署目录对齐；RPM 已将此目录归属 ldap:ldap、mode 0750
  path: /appdata/goldapadmin/data/goldapadmin.db

jwt:
  # ⚠️ 上线前必须替换
  #   openssl rand -base64 48
  secret: REPLACE_WITH_OPENSSL_RAND_BASE64_VALUE_MINUS_48_BYTES_XXXXXXXXXXXXXXXXXXXXXXXXX
  ttl: 12                               # 小时；默认 12h，与安全合规策略对齐

log:
  level: info

security:
  # 是否强制 LDAP 连接必须使用 TLS/SSL（默认 false 允许明文连接）
  # 🔒 生产建议 true；开启后未启用 TLS/SSL 的 LDAP 服务器将无法连接
  require_ldap_tls: true
  # TLS 证书校验由每个 LdapServer 记录的 skip_tls_verify 字段控制：
  # 使用 AD / 正规 CA 签发的证书时保持 false；仅自签名证书临时无法替换时才允许开启

  # 是否允许匿名登录；生产务必保持 false
  allow_anonymous_bind: false
  # 🔒 服务器配置管理（新增/修改/删除/测试连接）仅允许以下登录 DN
  # 留空 = 对所有用户关闭管理接口（fail-closed）；按完整 DN 大小写不敏感匹配
  admin_dns:
    - "uid=admin,ou=system,dc=company,dc=com"
  # 🔒 可信反向代理；只有来自这些地址的请求才解析 X-Forwarded-For（用于限流）
  # 未配置时只使用 TCP 连接对端地址，客户端无法伪造 XFF 绕过登录限流
  trusted_proxies:
    - "127.0.0.1"
  # 单请求体上限（字节），默认 2MiB
  max_body_bytes: 2097152

  # 只读模式：开启后禁止创建/修改/删除/移动/复制 LDAP 条目与 LDIF 导入
  # 适合仅需查询/审计的账号发放场景
  read_only: false

  cors:
    # 🔒 只允许公司正式域名；禁止 ["*"]
    # 反向代理转发时 Origin 应为浏览器实际访问的域名，例如：
    #   https://ldapadmin.company.com
    origins:
      - "https://ldapadmin.company.com"
      # - "https://admin.company.com"
