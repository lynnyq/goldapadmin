server:
  port: 8080
  mode: debug

database:
  path: ./data/goldapadmin.db

jwt:
  # 本地开发用弱密钥；release 模式会拒绝启动，生产请用 openssl rand -base64 48 生成
  secret: dev-local-only-secret-do-not-use-in-production-0123456789
  ttl: 24

log:
  level: info

# 安全相关配置（生产环境务必检查）
security:
  # 是否强制 LDAP 连接必须使用 TLS/SSL（默认 false，允许明文连接）
  # 生产环境建议开启 true，避免管理员凭据明文传输；开启后未启用 TLS/SSL 的服务器将无法连接
  require_ldap_tls: false
  # 是否允许匿名（无 BindDN）登录，默认 false
  allow_anonymous_bind: false
  # 允许管理服务器配置的登录 DN 白名单；为空时服务器配置管理接口对所有用户关闭
  admin_dns: []
  # 可信反向代理（如本机 nginx 127.0.0.1）；只有来自这些地址才解析 X-Forwarded-For
  trusted_proxies: []
  # 单请求体上限（字节），默认 2MiB
  max_body_bytes: 2097152
  # 只读模式：开启后禁止创建/修改/删除/移动/复制 LDAP 条目与 LDIF 导入
  read_only: false
  cors:
    # 允许跨域的 Origin 白名单；留空 = 只允许同源请求
    # 开发环境可放开：["http://localhost:5173", "http://127.0.0.1:5173"]
    # 生产环境必须指定具体域名，禁止 ["*"]
    origins: []
