# =============================================================================
# GoLDAPAdmin 生产环境 Nginx 反向代理配置
# 将此文件放到 /etc/nginx/conf.d/goldapadmin.conf 或 /etc/nginx/sites-available/
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ldap-admin.example.com;  # ⚠️ 改成你的域名

    # ---- TLS 证书 ----
    # Let's Encrypt: certbot certonly -d ldap-admin.example.com
    ssl_certificate     /etc/letsencrypt/live/ldap-admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ldap-admin.example.com/privkey.pem;

    # 现代 TLS 安全配置（A+ 评分）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- 反代到 GoLDAPAdmin ----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 必要的转发头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # GoLDAPAdmin 原生传递的 header (Authorization / X-Ldap-Password / X-Trace-ID)
        # Nginx 默认会透传所有客户端 header，无需额外配置

        # 连接超时
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # 缓冲区设置（LDAP 导出 LDIF 可能较大）
        proxy_buffer_size        16k;
        proxy_buffers           16 16k;
        proxy_busy_buffers_size  32k;
        proxy_max_temp_file_size 256m;

        # WebSocket 支持（GoLDAPAdmin 暂未使用，预留）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- 健康检查直接透传 ----
    location /api/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # ---- 静态资源缓存（GoLDAPAdmin 前端 /assets/*）----
    # Go embed 的静态资源文件名带 hash，可长缓存
    location ~* ^/assets/.*\.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---- 访问日志 ----
    access_log /var/log/nginx/goldapadmin.access.log;
    error_log  /var/log/nginx/goldapadmin.error.log warn;
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ldap-admin.example.com;

    # Let's Encrypt 验证路径（如果用 certbot）
    location /.well-known/acme-challenge/ {
        root /var/lib/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
